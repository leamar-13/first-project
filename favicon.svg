/* =============================================
   TRADEEDGE PRO — Global Stylesheet
   Brand: Dark Luxury Fintech
   Fonts: Playfair Display + JetBrains Mono + DM Sans
============================================= */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:        #080a0d;
  --bg2:       #0d1018;
  --bg3:       #121720;
  --surface:   #161c26;
  --surface2:  #1d2534;
  --border:    #1f2a3a;
  --border2:   #2a3650;
  --gold:      #c9a84c;
  --gold2:     #e8c97a;
  --gold-dim:  #7a5f2a;
  --green:     #22c55e;
  --red:       #ef4444;
  --blue:      #3b82f6;
  --text:      #f0f2f5;
  --text-2:    #a0aab8;
  --text-3:    #5a6478;
  --text-4:    #2f3a4d;
  --font-serif:  'Playfair Display', Georgia, serif;
  --font-mono:   'JetBrains Mono', monospace;
  --font-body:   'DM Sans', sans-serif;
  --radius:    4px;
  --shadow:    0 8px 40px rgba(0,0,0,0.5);
  --glow:      0 0 30px rgba(201,168,76,0.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { cursor: pointer; border: none; outline: none; }
input, select { outline: none; border: none; }

/* ---- SCROLLBAR ---- */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

/* ---- SHARED NAV ---- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem;
  height: 64px;
  background: rgba(8,10,13,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.nav-brand {
  display: flex; align-items: center; gap: 0.6rem;
  font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700;
  color: var(--text); letter-spacing: 0.5px;
}
.nav-brand .logo-icon {
  width: 32px; height: 32px;
  background: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 1rem; font-weight: 900;
  color: #000; border-radius: 4px;
}
.nav-brand span { color: var(--gold); }
.nav-links {
  display: flex; align-items: center; gap: 0.2rem;
  list-style: none;
}
.nav-links a {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 1px;
  color: var(--text-2); text-transform: uppercase;
  padding: 0.4rem 0.9rem; border-radius: var(--radius);
  transition: color 0.2s, background 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--gold); background: rgba(201,168,76,0.08); }
.nav-cta {
  display: flex; align-items: center; gap: 0.75rem;
}
.btn-nav-login {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 1px;
  color: var(--text-2); text-transform: uppercase; background: transparent;
  padding: 0.45rem 1rem; border: 1px solid var(--border2); border-radius: var(--radius);
  transition: border-color 0.2s, color 0.2s;
}
.btn-nav-login:hover { border-color: var(--gold); color: var(--gold); }
.btn-nav-start {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 1px;
  color: #000; text-transform: uppercase; background: var(--gold);
  padding: 0.45rem 1.2rem; border-radius: var(--radius);
  transition: background 0.2s, transform 0.15s;
}
.btn-nav-start:hover { background: var(--gold2); transform: translateY(-1px); }

/* hamburger */
.nav-ham {
  display: none; flex-direction: column; gap: 5px;
  background: transparent; padding: 6px;
}
.nav-ham span {
  display: block; width: 22px; height: 2px;
  background: var(--text-2); border-radius: 2px; transition: 0.3s;
}
.mobile-menu {
  display: none; position: fixed; top: 64px; left: 0; right: 0;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem; z-index: 190; flex-direction: column; gap: 0.2rem;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 1px;
  color: var(--text-2); text-transform: uppercase; padding: 0.7rem 0;
  border-bottom: 1px solid var(--border); transition: color 0.2s;
}
.mobile-menu a:last-child { border-bottom: none; }
.mobile-menu a:hover { color: var(--gold); }

/* ---- SHARED FOOTER ---- */
.footer {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 4rem 2rem 2rem;
}
.footer-grid {
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 3rem; max-width: 1100px; margin: 0 auto 3rem;
}
.footer-brand p {
  font-size: 0.85rem; color: var(--text-3); margin-top: 0.8rem; max-width: 260px; line-height: 1.7;
}
.footer-col h4 {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 2px;
  color: var(--gold); text-transform: uppercase; margin-bottom: 1rem;
}
.footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.footer-col ul a { font-size: 0.85rem; color: var(--text-3); transition: color 0.2s; }
.footer-col ul a:hover { color: var(--text); }
.footer-bottom {
  max-width: 1100px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 1.5rem; border-top: 1px solid var(--border);
  font-size: 0.75rem; color: var(--text-3);
}
.footer-bottom span { font-family: var(--font-mono); }

/* ---- SHARED BUTTONS ---- */
.btn-primary {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--gold); color: #000;
  font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 1.5px;
  text-transform: uppercase; font-weight: 500;
  padding: 0.8rem 1.8rem; border-radius: var(--radius);
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  border: none;
}
.btn-primary:hover { background: var(--gold2); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(201,168,76,0.3); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: transparent; color: var(--text);
  font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 1.5px;
  text-transform: uppercase; font-weight: 400;
  padding: 0.8rem 1.8rem; border-radius: var(--radius);
  border: 1px solid var(--border2);
  transition: border-color 0.2s, color 0.2s;
}
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

/* ---- SECTION LABEL ---- */
.label {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 3px;
  color: var(--gold); text-transform: uppercase;
  display: flex; align-items: center; gap: 0.6rem;
}
.label::before {
  content: ''; display: inline-block;
  width: 20px; height: 1px; background: var(--gold);
}

/* ---- BADGE ---- */
.badge {
  font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 1px;
  text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 2px;
}
.badge-gold { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid var(--gold-dim); }
.badge-green { background: rgba(34,197,94,0.12); color: var(--green); }
.badge-red   { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-blue  { background: rgba(59,130,246,0.12); color: var(--blue); }

/* ---- ANIMATIONS ---- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.anim-up  { animation: fadeUp 0.7s ease both; }
.anim-in  { animation: fadeIn 0.5s ease both; }

/* ---- TICKER ---- */
.ticker-bar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  overflow: hidden; padding: 0.45rem 0;
}
.ticker-track {
  display: flex; gap: 3rem;
  animation: tickerMove 35s linear infinite;
  white-space: nowrap;
}
.ticker-track:hover { animation-play-state: paused; }
.tick {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.5px;
  color: var(--text-3); display: inline-flex; gap: 0.5rem; align-items: center;
}
.tick .sym { color: var(--text-2); font-weight: 500; }
.tick .up  { color: var(--green); }
.tick .dn  { color: var(--red); }
@keyframes tickerMove {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ---- STAT CARD ---- */
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem;
}
.stat-card .sc-label {
  font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 2px;
  color: var(--text-3); text-transform: uppercase; margin-bottom: 0.4rem;
}
.stat-card .sc-value {
  font-family: var(--font-mono); font-size: 1.6rem; font-weight: 500;
  color: var(--text); line-height: 1;
}
.stat-card .sc-change {
  font-family: var(--font-mono); font-size: 0.75rem;
  margin-top: 0.3rem;
}

/* ---- RESPONSIVE ---- */
@media (max-width: 900px) {
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 2rem; }
}
@media (max-width: 640px) {
  .nav-links, .nav-cta { display: none; }
  .nav-ham { display: flex; }
  .footer-grid { grid-template-columns: 1fr; }
  .footer-bottom { flex-direction: column; gap: 0.5rem; text-align: center; }
}
